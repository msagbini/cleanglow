<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin panel</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/img/logo-mark.svg">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="admin-wrap">
  <div class="admin-header">
    <h1>📋 Bookings panel</h1>
    <button class="btn btn-ghost btn-sm" id="refreshBtn">Refresh</button>
  </div>

  <div class="stat-row" id="statRow"></div>

  <div class="filter-tabs" id="filterTabs">
    <button data-status="" class="active">All</button>
    <button data-status="pending_payment">Pending payment</button>
    <button data-status="paid">Paid</button>
    <button data-status="completed">Completed</button>
    <button data-status="cancelled">Cancelled</button>
    <button data-status="expired">Expired</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Reference</th>
          <th>Status</th>
          <th>Customer</th>
          <th>Service</th>
          <th>Date</th>
          <th>Frequency</th>
          <th>Amount</th>
          <th>Created</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="bookingsBody"></tbody>
    </table>
    <div class="loading-state" id="loadingState">Loading bookings…</div>
    <div class="empty-state" id="emptyState" hidden>No bookings match this filter.</div>
  </div>
</div>

<div class="modal-overlay" id="photosModal" hidden>
  <div class="modal">
    <button type="button" class="modal-close" id="photosModalClose" aria-label="Close">✕</button>
    <h2>Property condition photos — <span id="photosModalBookingId"></span></h2>
    <div class="photos-modal-grid" id="photosModalGrid"></div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
